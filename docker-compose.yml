services:
  traefik:
    image: traefik:latest
    restart: unless-stopped
    network_mode: host
    command:
      - --api.dashboard=false
      - --api.insecure=false
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    volumes:
      - traefik-letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  obsidian-headless:
    image: node:22
    restart: on-failure
    working_dir: /app
    volumes:
      - ./vault:/vault
      - obsidian-cache:/root/.obsidian-headless
    environment:
      - OBSIDIAN_EMAIL=${OBSIDIAN_EMAIL}
      - OBSIDIAN_PASSWORD=${OBSIDIAN_PASSWORD}
      - VAULT_PASSWORD=${VAULT_PASSWORD}
      - VAULT_NAME=${VAULT_NAME}
    command: bash -c "
      npm install -g obsidian-headless &&
      ob login --email $$OBSIDIAN_EMAIL --password $$OBSIDIAN_PASSWORD &&
      ob sync-setup --vault $$VAULT_NAME --path /vault --password "$$VAULT_PASSWORD" --device-name 'Hostinger' &&
      ob sync --path /vault --continuous
      "

  obsidian-api:
    image: node:22
    restart: unless-stopped
    working_dir: /tmp/app
    depends_on:
      - obsidian-headless
    volumes:
      - ./obsidian-api.js:/app/server.js
      - ./vault:/vault
      - sqlite-data:/data
    command: bash -c "rm -rf /tmp/repo && mkdir -p /tmp/app && git clone https://github.com/seb7152/obsidian-headless-mcp.git /tmp/repo && for f in obsidian-api.js vault-indexer.js webhooks.js search-index.js embeddings.js rerank.js; do cat /tmp/repo/$$f > /tmp/app/$$f; done && mv /tmp/app/obsidian-api.js /tmp/app/server.js && npm install express cors js-yaml better-sqlite3 chokidar @huggingface/transformers && node server.js"
    expose:
      - "3000"
    environment:
      - VAULT_PATH=/vault
      - SQLITE_PATH=/data/vault-index.db
      - PORT=3000
      - API_TOKEN=${API_TOKEN}
      # Webhooks config persists on the sqlite-data volume (NOT synced to Obsidian devices).
      - WEBHOOKS_CONFIG_PATH=/data/webhooks.json
      # Strict SSRF protection by default; set to true only to allow private/internal targets.
      - WEBHOOK_ALLOW_PRIVATE=${WEBHOOK_ALLOW_PRIVATE:-false}
      # Permanently purge soft-deleted files from .trash/ after this many days (0 = never).
      - TRASH_RETENTION_DAYS=${TRASH_RETENTION_DAYS:-30}
      # inotify is unreliable on Docker bind mounts (VPS hosts): poll the vault so
      # live indexing and webhooks fire on file changes. Tune the interval as needed.
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      # -- Hybrid search --------------------------------------------------
      # Semantic half of the search index. `local` runs a small multilingual
      # encoder on CPU (no data leaves the box, ~1 GB RSS once loaded).
      # Set to `jina`/`openai`/`voyage` to embed through an API instead —
      # cheaper in RAM, but the note text is sent to that provider.
      # `none` disables semantic search: the API falls back to BM25.
      - EMBED_PROVIDER=${EMBED_PROVIDER:-local}
      - EMBED_MODEL=${EMBED_MODEL:-Xenova/multilingual-e5-small}
      # Model weights land on the sqlite-data volume so a restart does not
      # re-download ~120 MB from HuggingFace.
      - TRANSFORMERS_CACHE=/data/models
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-8}
      # Optional cloud reranker (off unless a key is set AND the caller passes
      # rerank=true). Reranking sends the matching passages to the provider,
      # so keep sensitive folders out with RERANK_EXCLUDE_PATHS.
      - RERANK_PROVIDER=${RERANK_PROVIDER:-jina}
      - RERANK_MODEL=${RERANK_MODEL:-jina-reranker-v2-base-multilingual}
      - RERANK_EXCLUDE_PATHS=${RERANK_EXCLUDE_PATHS:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.obsidian-api.rule=Host(`obsidian-api.${DOMAIN}`)"
      - "traefik.http.routers.obsidian-api.entrypoints=websecure"
      - "traefik.http.routers.obsidian-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.obsidian-api.loadbalancer.server.port=3000"

  obsidian-mcp:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
      - obsidian-api
    command: python -c "import urllib.request, subprocess, sys, json, base64; subprocess.run([sys.executable, '-m', 'pip', 'install', '--quiet', 'mcp<2', 'httpx', 'uvicorn'], check=True); data=json.loads(urllib.request.urlopen('https://api.github.com/repos/seb7152/obsidian-headless-mcp/contents/obsidian_mcp.py').read()); open('/tmp/obsidian_mcp.py','w').write(base64.b64decode(data['content']).decode()); exec(open('/tmp/obsidian_mcp.py').read())"
    expose:
      - "3001"
    environment:
      - OBSIDIAN_API_URL=http://obsidian-api:3000/api
      - API_TOKEN=${API_TOKEN}
      - PORT=3001
      - VAULT_NAME=${VAULT_NAME}
      - MCP_PUBLIC_URL=https://mcp.${DOMAIN}
      - ZITADEL_ISSUER=${ZITADEL_ISSUER:-https://zitadel-k9z6.srv828065.hstgr.cloud}
      - OAUTH_REQUIRED_ROLE=${OAUTH_REQUIRED_ROLE:-obsidian:access}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.obsidian-mcp.rule=Host(`mcp.${DOMAIN}`)"
      - "traefik.http.routers.obsidian-mcp.entrypoints=websecure"
      - "traefik.http.routers.obsidian-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.obsidian-mcp.loadbalancer.server.port=3001"

volumes:
  traefik-letsencrypt:
  obsidian-cache:
  sqlite-data:
